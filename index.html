<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgeting Tips</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #333;
            padding: 40px 20px;
        }

        .budgeting-tips {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .budgeting-tips h2 {
            color: #1b7f5a;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .budget-icon {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin: 10px auto 20px;
            padding: 15px;
            background: #e8f7f0;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(27, 127, 90, 0.15);
        }

        .budgeting-tips p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .video-container iframe {
            display: block;
            width: 100%;
            height: 315px;
            border: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .budgeting-tips {
                padding: 20px 15px;
            }

            .budgeting-tips h2 {
                font-size: 24px;
            }

            .video-container iframe {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <section class="budgeting-tips">

        <h2>Budgeting Tips</h2>

        <img 
            class="budget-icon"
            src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png"
            alt="Budgeting and money icon"
        >

        <p>
            Learn simple and practical ways to manage your money,
            control your spending, and build better financial habits.
        </p>

        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/-xdDTCQObGo"
                title="Budgeting Tips"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

    </section>

</body>
</html>

</html>
